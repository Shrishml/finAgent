name: Deploy to Beta

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to beta.captwist.in
        uses: appleboy/ssh-action@v1
        with:
          host: 20.98.218.146
          username: azureuser
          key: ${{ secrets.BETA_SSH_KEY }}
          script: |
            cd /home/azureuser/finAgent-beta
            git pull origin dev
            cd src && .venv/bin/pip install -e . --quiet
            sudo systemctl restart finbestie-beta
            echo "Beta deployed ✅"
