<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">
  <defs>
    <filter id="ts" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Terminal window -->
  <rect width="640" height="340" rx="10" fill="#1e1e2e" filter="url(#ts)"/>
  <rect width="640" height="32" rx="10" fill="#2a2a3e"/>
  <rect y="22" width="640" height="10" fill="#2a2a3e"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/><circle cx="36" cy="16" r="6" fill="#febc2e"/><circle cx="54" cy="16" r="6" fill="#28c840"/>
  <text x="320" y="20" text-anchor="middle" font-size="11" fill="#888">finagent — terminal</text>

  <!-- Line 1: pip install -->
  <text x="16" y="58" font-size="12">
    <tspan fill="#a6e3a1">❯</tspan>
    <tspan fill="#cdd6f4"> pip install finagent</tspan>
  </text>
  <text x="16" y="76" font-size="11" fill="#6c7086">Successfully installed finagent-0.1.0</text>

  <!-- Line 2: python command -->
  <text x="16" y="104" font-size="12">
    <tspan fill="#a6e3a1">❯</tspan>
    <tspan fill="#cdd6f4"> finagent analyze portfolio.pdf</tspan>
  </text>

  <!-- Output -->
  <text x="16" y="130" font-size="11" fill="#89b4fa">🔍 Parsing CAS statement... found 7 mutual funds</text>
  <text x="16" y="148" font-size="11" fill="#89b4fa">📊 Running overlap analysis...</text>
  <text x="16" y="166" font-size="11" fill="#89b4fa">💰 Calculating expense impact...</text>
  <text x="16" y="184" font-size="11" fill="#89b4fa">🧠 Cross-checking tax sections...</text>

  <!-- Results -->
  <text x="16" y="210" font-size="12" fill="#a6e3a1" font-weight="bold">✅ Analysis Complete</text>

  <text x="16" y="234" font-size="11" fill="#cdd6f4">  Funds analyzed:     <tspan fill="#fab387">7</tspan></text>
  <text x="16" y="252" font-size="11" fill="#cdd6f4">  Overlap detected:   <tspan fill="#f38ba8">HDFC Top 100 ↔ UTI Nifty 50 (82%)</tspan></text>
  <text x="16" y="270" font-size="11" fill="#cdd6f4">  Excess expenses:    <tspan fill="#f38ba8">₹18,400/year</tspan> (consolidate to save)</text>
  <text x="16" y="288" font-size="11" fill="#cdd6f4">  Recommendation:     <tspan fill="#a6e3a1">7 → 4 funds, +1.6% XIRR improvement</tspan></text>

  <!-- Next prompt -->
  <text x="16" y="316" font-size="12">
    <tspan fill="#a6e3a1">❯</tspan>
    <tspan fill="#6c7086"> finagent chat</tspan>
    <tspan fill="#f9e2af">▊</tspan>
  </text>
</svg>
