<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — Arth</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .blog-body h2 { font-size: 1.375rem; font-weight: 800; color: #111827; margin: 2rem 0 0.75rem; }
  .blog-body p { color: #4b5563; line-height: 1.8; margin-bottom: 1rem; }
  .blog-body ul { list-style: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
  .blog-body li { color: #4b5563; line-height: 1.8; margin-bottom: 0.5rem; }
  .blog-body strong { color: #111827; }
  .blog-body em { color: #9ca3af; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-white border-b sticky top-0 z-10">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3">
      <a href="/demo" class="flex items-center gap-2 text-sm font-bold text-gray-500 hover:text-gray-900">← Back to Arth</a>
    </div>
  </nav>
  <article class="max-w-3xl mx-auto px-4 py-8">
    <img src="{{IMAGE}}" alt="" class="w-full h-56 sm:h-72 object-cover rounded-2xl mb-8">
    <div class="mb-6">
      <span class="text-xs font-bold text-emerald-600 uppercase tracking-widest">{{READ_TIME}}</span>
      <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 tracking-tight mt-2 leading-tight">{{TITLE}}</h1>
    </div>
    <div class="blog-body">{{BODY}}</div>
    <div class="mt-12 pt-8 border-t">
      <div class="bg-gradient-to-br from-gray-900 to-emerald-900 rounded-2xl p-6 text-center">
        <p class="text-white font-bold text-lg mb-2">Want to run these numbers on YOUR finances?</p>
        <a href="/demo" class="inline-block bg-emerald-500 text-white font-bold px-6 py-3 rounded-xl hover:bg-emerald-400 transition-all">Try Arth Free →</a>
      </div>
    </div>
  </article>
</body>
</html>
