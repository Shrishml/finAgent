<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinBestie</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  .chat-msg { white-space: pre-wrap; }
  #chat-box { scroll-behavior: smooth; }
  .chat-sidebar { transition: width 0.3s ease; }
  .chart-container { position: relative; height: 200px; }
</style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<!-- Header -->
<header class="bg-white border-b px-6 py-3 flex items-center justify-between">
  <div>
    <h1 class="text-xl font-bold text-gray-800">💰 FinBestie</h1>
    <p class="text-xs text-gray-400">Your money, your bestie, your rules.</p>
  </div>
  <div class="flex items-center gap-3">
    <span id="status" class="text-sm text-gray-400">No data loaded</span>
    <button id="toggle-upload" class="text-xs text-blue-600 hover:underline hidden">Upload PDF</button>
    <button id="clear-btn" class="text-xs text-red-500 hover:underline hidden">Clear</button>
    <button id="chat-toggle" class="bg-green-600 text-white rounded-full w-10 h-10 flex items-center justify-center text-lg hover:bg-green-700 shadow" title="Toggle chat">💬</button>
  </div>
</header>

<div class="flex-1 flex w-full">

  <!-- Main: Portfolio Dashboard -->
  <div id="main-area" class="flex-1 overflow-y-auto p-6">

    <!-- Upload (shown when no data) -->
    <div id="upload-section" class="max-w-md mx-auto mt-16">
      <div class="bg-white rounded-lg border p-6">
        <h2 class="font-semibold text-gray-700 mb-2">📄 Upload CAS Statement</h2>
        <p class="text-xs text-gray-400 mb-3">Get yours from <a href="https://www.camsonline.com/Investors/Statements/Consolidated-Account-Statement" target="_blank" class="text-blue-500 underline">camsonline.com</a> (Detailed, password = PAN)</p>
        <form id="upload-form" class="flex flex-col gap-2">
          <input type="file" id="file-input" accept=".pdf" class="text-sm" required>
          <input type="password" id="password-input" placeholder="PDF Password (your PAN)" class="border rounded px-3 py-2 text-sm">
          <button type="submit" id="upload-btn" class="bg-blue-600 text-white rounded px-4 py-2 text-sm hover:bg-blue-700">Upload & Parse</button>
        </form>
        <div id="upload-status" class="text-sm mt-2 hidden"></div>
      </div>
    </div>

    <!-- Dashboard (hidden until data loaded) -->
    <div id="dashboard" class="hidden max-w-6xl mx-auto">

      <!-- Summary Bar -->
      <div id="summary-bar" class="bg-white rounded-lg border p-4 mb-4"></div>

      <!-- Charts Row -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        <div class="bg-white rounded-lg border p-4">
          <h3 class="text-sm font-semibold text-gray-600 mb-2">Category Allocation</h3>
          <div class="chart-container"><canvas id="chart-category"></canvas></div>
        </div>
        <div class="bg-white rounded-lg border p-4">
          <h3 class="text-sm font-semibold text-gray-600 mb-2">Equity vs Debt</h3>
          <div class="chart-container"><canvas id="chart-asset"></canvas></div>
        </div>
        <div class="bg-white rounded-lg border p-4">
          <h3 class="text-sm font-semibold text-gray-600 mb-2">Top Holdings</h3>
          <div class="chart-container"><canvas id="chart-top"></canvas></div>
        </div>
      </div>

      <!-- Fund Cards Grid -->
      <h3 class="text-sm font-semibold text-gray-600 mb-2">Your Funds</h3>
      <div id="fund-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 mb-6"></div>
    </div>
  </div>

  <!-- Chat Sidebar (collapsed by default) -->
  <div id="chat-sidebar" class="chat-sidebar w-0 overflow-hidden border-l bg-white flex flex-col">
    <div class="p-3 border-b flex justify-between items-center">
      <span class="font-semibold text-gray-700 text-sm">💬 Chat</span>
      <button id="chat-close" class="text-gray-400 hover:text-gray-600 text-lg">✕</button>
    </div>
    <div id="chat-box" class="flex-1 overflow-y-auto p-3 space-y-2">
      <div id="suggestions-area" class="py-4 text-center"><p class="text-gray-400 text-xs">Ask about your portfolio...</p></div>
    </div>
    <form id="chat-form" class="border-t p-2 flex gap-2">
      <input type="text" id="chat-input" placeholder="Ask anything..." class="flex-1 border rounded px-2 py-1.5 text-sm" autocomplete="off">
      <button type="submit" class="bg-green-600 text-white rounded px-3 py-1.5 text-sm hover:bg-green-700">Send</button>
    </form>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const chatSidebar = $('chat-sidebar');
const chatToggle = $('chat-toggle');
const chatClose = $('chat-close');
const chatBox = $('chat-box');
const chatForm = $('chat-form');
const chatInput = $('chat-input');
const uploadForm = $('upload-form');
const uploadSection = $('upload-section');
const uploadStatus = $('upload-status');
const dashboard = $('dashboard');
const statusEl = $('status');

let charts = {};

// Chat toggle
function toggleChat() {
  const open = chatSidebar.style.width === '360px';
  chatSidebar.style.width = open ? '0' : '360px';
}
chatToggle.addEventListener('click', toggleChat);
chatClose.addEventListener('click', toggleChat);

function addMsg(text, sender) {
  const sa = $('suggestions-area');
  if (sa) sa.remove();
  const div = document.createElement('div');
  div.className = sender === 'user'
    ? 'chat-msg bg-blue-50 rounded-lg p-2 text-xs ml-8'
    : 'chat-msg bg-gray-100 rounded-lg p-2 text-xs mr-8';
  div.textContent = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

// Chart colors
const COLORS = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4','#84cc16','#f97316','#6366f1'];

function classifyAsset(category) {
  if (!category) return 'Other';
  const c = category.toLowerCase();
  if (c.includes('equity') || c.includes('elss')) return 'Equity';
  if (c.includes('debt') || c.includes('liquid') || c.includes('money market') || c.includes('gilt') || c.includes('overnight')) return 'Debt';
  if (c.includes('hybrid')) return 'Hybrid';
  return 'Other';
}

function classifyCap(category) {
  if (!category) return 'Other';
  const c = category.toLowerCase();
  if (c.includes('large cap') || c.includes('large & mid')) return 'Large Cap';
  if (c.includes('mid cap')) return 'Mid Cap';
  if (c.includes('small cap')) return 'Small Cap';
  if (c.includes('flexi') || c.includes('multi')) return 'Flexi/Multi Cap';
  if (c.includes('elss')) return 'ELSS';
  if (c.includes('index') || c.includes('etf')) return 'Index/ETF';
  return classifyAsset(category);
}

function renderCharts(holdings) {
  // Destroy old charts
  Object.values(charts).forEach(c => c.destroy());
  charts = {};

  const total = holdings.reduce((s, h) => s + h.value, 0);

  // Category allocation (donut)
  const catMap = {};
  holdings.forEach(h => {
    const cat = classifyCap(h.category);
    catMap[cat] = (catMap[cat] || 0) + h.value;
  });
  charts.category = new Chart($('chart-category'), {
    type: 'doughnut',
    data: { labels: Object.keys(catMap), datasets: [{ data: Object.values(catMap), backgroundColor: COLORS }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 10, font: { size: 10 } } } } }
  });

  // Equity vs Debt (donut)
  const assetMap = {};
  holdings.forEach(h => {
    const a = classifyAsset(h.category);
    assetMap[a] = (assetMap[a] || 0) + h.value;
  });
  charts.asset = new Chart($('chart-asset'), {
    type: 'doughnut',
    data: { labels: Object.keys(assetMap), datasets: [{ data: Object.values(assetMap), backgroundColor: ['#3b82f6','#10b981','#f59e0b','#94a3b8'] }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 10, font: { size: 10 } } } } }
  });

  // Top holdings (horizontal bar)
  const sorted = [...holdings].sort((a, b) => b.value - a.value).slice(0, 6);
  charts.top = new Chart($('chart-top'), {
    type: 'bar',
    data: {
      labels: sorted.map(h => h.scheme.replace(/ - Direct.*| - Regular.*/, '').slice(0, 20)),
      datasets: [{ data: sorted.map(h => h.value), backgroundColor: COLORS }]
    },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { callback: v => '₹' + (v/1000).toFixed(0) + 'k' } } } }
  });
}

function renderSummary(holdings) {
  const total = holdings.reduce((s, h) => s + h.value, 0);
  const invested = holdings.reduce((s, h) => s + (h.invested || 0), 0);
  const ret = total - invested;
  const retPct = invested > 0 ? (ret / invested * 100).toFixed(1) : 0;
  const c = ret >= 0 ? 'text-green-600' : 'text-red-600';
  const s = ret >= 0 ? '+' : '';

  $('summary-bar').innerHTML = `
    <div class="flex flex-wrap items-center gap-6">
      <div>
        <div class="text-xs text-gray-400">Current Value</div>
        <div class="text-2xl font-bold text-gray-800">₹${total.toLocaleString('en-IN', {maximumFractionDigits: 0})}</div>
      </div>
      <div>
        <div class="text-xs text-gray-400">Invested</div>
        <div class="text-lg text-gray-600">₹${invested.toLocaleString('en-IN', {maximumFractionDigits: 0})}</div>
      </div>
      <div>
        <div class="text-xs text-gray-400">Total Return</div>
        <div class="text-lg font-semibold ${c}">${s}₹${Math.abs(ret).toLocaleString('en-IN', {maximumFractionDigits: 0})} (${s}${retPct}%)</div>
      </div>
      <div>
        <div class="text-xs text-gray-400">Schemes</div>
        <div class="text-lg text-gray-600">${holdings.length}</div>
      </div>
    </div>`;
}

function renderFundCards(holdings) {
  const total = holdings.reduce((s, h) => s + h.value, 0);
  $('fund-grid').innerHTML = holdings
    .sort((a, b) => b.value - a.value)
    .map(h => {
      const wt = total > 0 ? (h.value / total * 100).toFixed(1) : 0;
      const er = h.expense_ratio ? (h.expense_ratio * 100).toFixed(2) + '%' : '—';
      const absRet = h.absolute_return || 0;
      const retPct = h.return_pct || 0;
      const xirr = h.xirr;
      const c = absRet >= 0 ? 'text-green-600' : 'text-red-600';
      const s = absRet >= 0 ? '+' : '';
      const cat = classifyCap(h.category);
      const hint = h.expense_ratio > 0.007 ? `<span class="compare-hint cursor-pointer text-yellow-500" data-amfi="${h.amfi_code || ''}" title="Find cheaper alternatives">💡</span>` : '';
      return `<div class="bg-white border rounded-lg p-3 text-xs hover:shadow-md transition-shadow">
        <div class="flex justify-between items-start mb-2">
          <div class="font-medium text-gray-700 truncate pr-2 flex-1" title="${h.scheme}">${h.scheme.replace(/ - Direct.*| - Regular.*/, '')}</div>
          ${hint}
        </div>
        <div class="flex gap-1 mb-2">
          <span class="bg-blue-50 text-blue-600 rounded px-1.5 py-0.5 text-[10px]">${cat}</span>
          <span class="bg-gray-50 text-gray-500 rounded px-1.5 py-0.5 text-[10px]">${h.plan}</span>
        </div>
        <div class="grid grid-cols-2 gap-x-3 gap-y-1.5">
          <div><span class="text-gray-400">Current</span><div class="font-semibold text-gray-800">₹${h.value.toLocaleString('en-IN', {maximumFractionDigits: 0})}</div></div>
          <div><span class="text-gray-400">Invested</span><div class="text-gray-600">₹${(h.invested || 0).toLocaleString('en-IN', {maximumFractionDigits: 0})}</div></div>
          <div><span class="text-gray-400">Return</span><div class="${c} font-medium">${s}₹${Math.abs(absRet).toLocaleString('en-IN', {maximumFractionDigits: 0})} (${s}${retPct.toFixed(1)}%)</div></div>
          <div><span class="text-gray-400 cursor-help" title="Based on transactions in your CAS statement">XIRR ⓘ</span><div class="${xirr !== null ? (xirr >= 0 ? 'text-green-600' : 'text-red-600') : 'text-gray-400'} font-medium">${xirr !== null ? (xirr >= 0 ? '+' : '') + xirr.toFixed(1) + '%' : '—'}</div></div>
        </div>
        <div class="flex justify-between text-gray-400 mt-2 pt-1.5 border-t border-gray-100">
          <span>Wt: ${wt}%</span>
          <span>ER: ${er}</span>
        </div>
      </div>`;
    }).join('');

  // Wire compare hints
  document.querySelectorAll('.compare-hint').forEach(el => {
    el.addEventListener('click', () => {
      const name = el.closest('.bg-white').querySelector('.font-medium').textContent;
      chatSidebar.style.width = '360px';
      chatInput.value = `Are there cheaper alternatives to ${name}?`;
      chatForm.dispatchEvent(new Event('submit'));
    });
  });
}

function showPortfolio(holdings) {
  if (!holdings || holdings.length === 0) return;
  uploadSection.classList.add('hidden');
  dashboard.classList.remove('hidden');
  $('toggle-upload').classList.remove('hidden');
  $('clear-btn').classList.remove('hidden');
  statusEl.textContent = `${holdings.length} schemes`;
  statusEl.className = 'text-sm text-green-600';

  renderSummary(holdings);
  renderCharts(holdings);
  renderFundCards(holdings);
}

// Upload
uploadForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const file = $('file-input').files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  fd.append('password', $('password-input').value);
  $('upload-btn').textContent = 'Parsing...';
  uploadStatus.classList.remove('hidden');
  uploadStatus.textContent = 'Uploading and parsing...';
  uploadStatus.className = 'text-sm mt-2 text-blue-600';
  try {
    const res = await fetch('/upload', { method: 'POST', body: fd });
    const data = await res.json();
    if (data.status === 'ok') {
      uploadStatus.textContent = `✅ ${data.holdings_count} schemes parsed`;
      uploadStatus.className = 'text-sm mt-2 text-green-600';
      fetch('/holdings').then(r => r.json()).then(d => showPortfolio(d.holdings));
    } else {
      uploadStatus.textContent = `❌ ${data.message}`;
      uploadStatus.className = 'text-sm mt-2 text-red-600';
    }
  } catch (err) {
    uploadStatus.textContent = `❌ ${err.message}`;
    uploadStatus.className = 'text-sm mt-2 text-red-600';
  }
  $('upload-btn').textContent = 'Upload & Parse';
});

// Chat
chatForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = chatInput.value.trim();
  if (!q) return;
  addMsg(q, 'user');
  chatInput.value = '';
  addMsg('Thinking...', 'agent');
  try {
    const fd = new FormData();
    fd.append('query', q);
    const res = await fetch('/chat', { method: 'POST', body: fd });
    const data = await res.json();
    chatBox.lastChild.remove();
    addMsg(data.status === 'ok' ? data.response : `Error: ${data.message}`, 'agent');
    fetch('/holdings').then(r => r.json()).then(d => { if (d.count > 0) showPortfolio(d.holdings); });
  } catch (err) {
    chatBox.lastChild.remove();
    addMsg(`Error: ${err.message}`, 'agent');
  }
});

$('toggle-upload').addEventListener('click', () => uploadSection.classList.toggle('hidden'));
$('clear-btn').addEventListener('click', async () => {
  await fetch('/clear', { method: 'POST' });
  dashboard.classList.add('hidden');
  uploadSection.classList.remove('hidden');
  $('toggle-upload').classList.add('hidden');
  $('clear-btn').classList.add('hidden');
  statusEl.textContent = 'No data loaded';
  statusEl.className = 'text-sm text-gray-400';
});

// Load existing data
fetch('/holdings').then(r => r.json()).then(data => {
  if (data.count > 0) showPortfolio(data.holdings);
});
</script>
</body>
</html>
