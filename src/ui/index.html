<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinAgent</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .chat-msg { white-space: pre-wrap; }
  #chat-box { scroll-behavior: smooth; }
</style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<!-- Header -->
<header class="bg-white border-b px-6 py-3 flex items-center justify-between">
  <div>
    <h1 class="text-xl font-bold text-gray-800">🤖 FinAgent</h1>
    <p class="text-xs text-gray-400">Your money, your agent, your rules.</p>
  </div>
  <div class="flex items-center gap-3">
    <span id="status" class="text-sm text-gray-400">No data loaded</span>
    <button id="toggle-upload" class="text-xs text-blue-600 hover:underline hidden">Upload PDF</button>
    <button id="clear-btn" class="text-xs text-red-500 hover:underline hidden">Clear</button>
  </div>
</header>

<div class="flex-1 flex max-w-5xl mx-auto w-full p-4 gap-4">

  <!-- Left: Chat (primary) -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- Upload (collapsible) -->
    <div id="upload-section" class="bg-white rounded-lg border p-4 mb-4">
      <h2 class="font-semibold text-gray-700 mb-2">📄 Upload CAS Statement</h2>
      <p class="text-xs text-gray-400 mb-2">Get yours from <a href="https://www.camsonline.com/Investors/Statements/Consolidated-Account-Statement" target="_blank" class="text-blue-500 underline">camsonline.com</a> (Detailed, password = PAN)</p>
      <form id="upload-form" class="flex flex-col gap-2">
        <input type="file" id="file-input" accept=".pdf" class="text-sm" required>
        <input type="password" id="password-input" placeholder="PDF Password (your PAN)"
               class="border rounded px-3 py-2 text-sm">
        <button type="submit" id="upload-btn"
                class="bg-blue-600 text-white rounded px-4 py-2 text-sm hover:bg-blue-700">
          Upload & Parse
        </button>
      </form>
      <div id="upload-status" class="text-sm mt-2 hidden"></div>
    </div>

    <!-- Chat -->
    <div class="bg-white rounded-lg border flex-1 flex flex-col min-h-[400px]">
      <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div class="text-gray-400 text-sm text-center py-8" id="chat-placeholder">
          Upload a CAMS PDF to get started, then ask about your portfolio.
        </div>
      </div>
      <form id="chat-form" class="border-t p-3 flex gap-2">
        <input type="text" id="chat-input" placeholder="Ask about your portfolio..."
               class="flex-1 border rounded px-3 py-2 text-sm" autocomplete="off">
        <button type="submit" class="bg-green-600 text-white rounded px-4 py-2 text-sm hover:bg-green-700">Send</button>
      </form>
    </div>
  </div>

  <!-- Right: Portfolio Panel (hidden until data loaded) -->
  <div id="portfolio-panel" class="w-72 hidden flex-shrink-0">
    <div class="bg-white rounded-lg border p-4 sticky top-4">
      <h2 class="font-semibold text-gray-700 mb-1">📊 Portfolio</h2>
      <div id="portfolio-summary" class="text-xs text-gray-500 mb-3"></div>
      <div id="portfolio-list" class="space-y-2 max-h-[70vh] overflow-y-auto"></div>
    </div>
  </div>
</div>

<script>
const chatBox = document.getElementById('chat-box');
const chatForm = document.getElementById('chat-form');
const chatInput = document.getElementById('chat-input');
const uploadForm = document.getElementById('upload-form');
const uploadSection = document.getElementById('upload-section');
const uploadStatus = document.getElementById('upload-status');
const statusEl = document.getElementById('status');
const portfolioPanel = document.getElementById('portfolio-panel');
const portfolioList = document.getElementById('portfolio-list');
const portfolioSummary = document.getElementById('portfolio-summary');
const toggleUpload = document.getElementById('toggle-upload');
const clearBtn = document.getElementById('clear-btn');

function addMsg(text, sender) {
  const ph = document.getElementById('chat-placeholder');
  if (ph) ph.remove();
  const div = document.createElement('div');
  div.className = sender === 'user'
    ? 'chat-msg bg-blue-50 rounded-lg p-3 text-sm ml-12'
    : 'chat-msg bg-gray-100 rounded-lg p-3 text-sm mr-12';
  div.textContent = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function showPortfolio(holdings) {
  if (!holdings || holdings.length === 0) return;
  const total = holdings.reduce((s, h) => s + h.value, 0);
  portfolioSummary.innerHTML = `<span class="font-medium text-gray-700">₹${(total).toLocaleString('en-IN', {maximumFractionDigits: 0})}</span> across ${holdings.length} schemes`;

  portfolioList.innerHTML = holdings
    .sort((a, b) => b.value - a.value)
    .map(h => {
      const pct = total > 0 ? (h.value / total * 100).toFixed(1) : 0;
      const er = h.expense_ratio ? (h.expense_ratio * 100).toFixed(2) + '%' : '—';
      return `<div class="border rounded p-2 text-xs">
        <div class="font-medium text-gray-700 truncate" title="${h.scheme}">${h.scheme.replace(/ - Direct.*| - Regular.*/, '')}</div>
        <div class="flex justify-between text-gray-500 mt-1">
          <span>₹${h.value.toLocaleString('en-IN', {maximumFractionDigits: 0})}</span>
          <span>${pct}%</span>
        </div>
        <div class="flex justify-between text-gray-400 mt-0.5">
          <span>${h.plan}</span>
          <span>ER: ${er}</span>
        </div>
      </div>`;
    }).join('');

  portfolioPanel.classList.remove('hidden');
  uploadSection.classList.add('hidden');
  toggleUpload.classList.remove('hidden');
  clearBtn.classList.remove('hidden');
  statusEl.textContent = `${holdings.length} schemes`;
  statusEl.className = 'text-sm text-green-600';
}

uploadForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const file = document.getElementById('file-input').files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  fd.append('password', document.getElementById('password-input').value);
  document.getElementById('upload-btn').textContent = 'Parsing...';
  uploadStatus.classList.remove('hidden');
  uploadStatus.textContent = 'Uploading and parsing...';
  uploadStatus.className = 'text-sm mt-2 text-blue-600';
  try {
    const res = await fetch('/upload', { method: 'POST', body: fd });
    const data = await res.json();
    if (data.status === 'ok') {
      uploadStatus.textContent = `✅ ${data.holdings_count} schemes parsed`;
      uploadStatus.className = 'text-sm mt-2 text-green-600';
      addMsg(`Loaded ${data.holdings_count} mutual fund scheme(s). Ask me anything!`, 'agent');
      fetch('/holdings').then(r => r.json()).then(d => showPortfolio(d.holdings));
    } else {
      uploadStatus.textContent = `❌ ${data.message}`;
      uploadStatus.className = 'text-sm mt-2 text-red-600';
    }
  } catch (err) {
    uploadStatus.textContent = `❌ ${err.message}`;
    uploadStatus.className = 'text-sm mt-2 text-red-600';
  }
  document.getElementById('upload-btn').textContent = 'Upload & Parse';
});

chatForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = chatInput.value.trim();
  if (!q) return;
  addMsg(q, 'user');
  chatInput.value = '';
  addMsg('Thinking...', 'agent');
  try {
    const fd = new FormData();
    fd.append('query', q);
    const res = await fetch('/chat', { method: 'POST', body: fd });
    const data = await res.json();
    chatBox.lastChild.remove();
    addMsg(data.status === 'ok' ? data.response : `Error: ${data.message}`, 'agent');
    // Refresh portfolio in case enrichment happened
    fetch('/holdings').then(r => r.json()).then(d => { if (d.count > 0) showPortfolio(d.holdings); });
  } catch (err) {
    chatBox.lastChild.remove();
    addMsg(`Error: ${err.message}`, 'agent');
  }
});

toggleUpload.addEventListener('click', () => {
  uploadSection.classList.toggle('hidden');
});

clearBtn.addEventListener('click', async () => {
  await fetch('/clear', { method: 'POST' });
  portfolioPanel.classList.add('hidden');
  uploadSection.classList.remove('hidden');
  toggleUpload.classList.add('hidden');
  clearBtn.classList.add('hidden');
  statusEl.textContent = 'No data loaded';
  statusEl.className = 'text-sm text-gray-400';
});

// Load existing data on page load
fetch('/holdings').then(r => r.json()).then(data => {
  if (data.count > 0) showPortfolio(data.holdings);
});
</script>
</body>
</html>
